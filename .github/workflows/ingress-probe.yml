name: TennisMyLife versioned raw CSV archive
# Verified original bytes; SHA-based NO_CHANGE de-duplication.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingress-probe.yml'
      - 'scripts/ingest.py'
  # Kyiv 07:00, 10:00 and 21:00; candidates cover winter/summer UTC offsets.
  schedule:
    - cron: '0 4,5,7,8,18,19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: tml-raw-ingestion
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Do not skip cron-triggered runs based on actual wall clock: GitHub schedule
      # delivery can be early/late. SHA deduplication makes extra checks safe.
      - name: Permit scheduled and manual snapshots
        id: window
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Retrieve and verify original CSV bytes
        if: steps.window.outputs.run == 'true'
        id: ingestion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ingest.py
      - name: Archive 2025 raw CSV when changed
        if: steps.ingestion.outputs.upload_2025 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tml-2025-${{ steps.ingestion.outputs.hash_2025 }}
          path: snapshots/2025/*.csv
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Archive 2026 raw CSV when changed
        if: steps.ingestion.outputs.upload_2026 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tml-2026-${{ steps.ingestion.outputs.hash_2026 }}
          path: snapshots/2026/*.csv
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Archive ongoing tourneys CSV when changed
        if: steps.ingestion.outputs.upload_ongoing_tourneys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tml-ongoing_tourneys-${{ steps.ingestion.outputs.hash_ongoing_tourneys }}
          path: snapshots/ongoing_tourneys/*.csv
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Save run manifest (including NO_CHANGE/failures)
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tml-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: run_manifest/manifest.json
          retention-days: 90
          if-no-files-found: warn
